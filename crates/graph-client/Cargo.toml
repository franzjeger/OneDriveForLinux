[package]
name = "graph-client"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
oauth2 = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
percent-encoding = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
dirs = "5"
