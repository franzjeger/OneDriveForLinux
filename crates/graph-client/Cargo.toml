[package]
name = "graph-client"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
url = "2"
percent-encoding = "2"
base64.workspace = true
sha2.workspace = true
futures.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
dirs.workspace = true

[features]
# Exposes the mock-server constructors (`GraphClient::with_base_url`,
# `AuthManager::for_tests`) to other crates' tests. Never enabled in a release
# build — only by dev-dependencies.
test-util = []

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
