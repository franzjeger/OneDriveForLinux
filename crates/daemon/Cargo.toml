[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "onedrive-daemon"
path = "src/main.rs"

[dependencies]
sync-engine = { path = "../sync-engine" }
graph-client = { path = "../graph-client" }
vfs = { path = "../vfs" }
tray = { path = "../tray" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
dirs.workspace = true
zbus = { version = "5", features = ["tokio"] }
fuse3 = { version = "0.7", features = ["tokio-runtime", "unprivileged"] }
futures.workspace = true
parking_lot.workspace = true
chrono.workspace = true
