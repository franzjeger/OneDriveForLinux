[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "odctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
zbus = { version = "5", features = ["tokio"] }
tokio.workspace = true
tabled = "0.15"
toml = "0.8"
dirs.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
