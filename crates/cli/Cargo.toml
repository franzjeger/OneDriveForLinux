[package]
name = "cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "odctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
tabled = "0.15"
toml = "0.8"
dirs = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
