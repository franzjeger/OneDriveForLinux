[package]
name = "sync-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
graph-client = { path = "../graph-client" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "6"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
futures = "0.3"
dirs = "5"
parking_lot = "0.12"
dashmap = "6"
libc = "0.2"
walkdir = "2"
base64 = "0.22"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
