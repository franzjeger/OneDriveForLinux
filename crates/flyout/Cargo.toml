[package]
name = "flyout"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "onedrive-flyout"
path = "src/main.rs"

[dependencies]
# default_fonts is NOT optional here: without it egui embeds no font data, so
# every label renders as nothing while shapes (bars, separators, button frames)
# still draw — a window that looks blank rather than broken.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
zbus = { version = "5", features = ["blocking-api"] }
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
