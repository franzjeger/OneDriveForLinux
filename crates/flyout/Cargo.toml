[package]
name = "flyout"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "onedrive-flyout"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11"] }
zbus = { version = "5", features = ["blocking-api"] }
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
