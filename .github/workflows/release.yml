name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0) — creates the tag"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libfuse3-dev fuse3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A dispatch input is free text and the tag is used verbatim, so a
      # version typed without the leading "v" produces a tag the push trigger
      # ("v*") would never match and install.sh does not recognise. Normalise
      # once, here, rather than relying on whoever types it.
      - name: Resolve the version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          case "$VERSION" in
            v*) ;;
            *) VERSION="v$VERSION" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Build
        # Stamps the release into the binaries: every crate is version 0.1.0, so
        # without this `odctl --version` and the daemon's startup log both
        # report "0.1.0" for every build ever shipped — no way to tell whether
        # an upgrade took.
        env:
          ONEDRIVE_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --workspace

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIST="onedrive-linux-${VERSION}-x86_64"
          mkdir -p "$DIST"
          cp target/release/onedrive-daemon target/release/odctl target/release/onedrive-flyout "$DIST/"
          cp config/systemd/onedrive-linux.service deploy.sh install.sh README.md "$DIST/"
          # --local installs the launcher icon from ./assets, so ship it.
          mkdir -p "$DIST/assets"
          cp -r assets/. "$DIST/assets/"
          # --with-dolphin-overlay compiles from these.
          mkdir -p "$DIST/extensions"
          cp -r extensions/. "$DIST/extensions/"
          tar czf "$DIST.tar.gz" "$DIST"
          sha256sum "$DIST.tar.gz" > "$DIST.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            onedrive-linux-*.tar.gz
            onedrive-linux-*.tar.gz.sha256
          generate_release_notes: true
