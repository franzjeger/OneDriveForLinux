name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0) — creates the tag"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libfuse3-dev fuse3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          DIST="onedrive-linux-${VERSION}-x86_64"
          mkdir -p "$DIST"
          cp target/release/onedrive-daemon target/release/odctl target/release/onedrive-flyout "$DIST/"
          cp config/systemd/onedrive-linux.service deploy.sh install.sh README.md "$DIST/"
          # --local installs the launcher icon from ./assets, so ship it.
          mkdir -p "$DIST/assets"
          cp assets/onedrive-linux.svg "$DIST/assets/"
          tar czf "$DIST.tar.gz" "$DIST"
          sha256sum "$DIST.tar.gz" > "$DIST.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            onedrive-linux-*.tar.gz
            onedrive-linux-*.tar.gz.sha256
          generate_release_notes: true
