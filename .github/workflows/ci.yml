name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config libfuse3-dev fuse3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # ONEDRIVE_REQUIRE_FUSE turns the mount round trip's "skipped, no FUSE
        # here" escape hatch into a failure. Without it a runner image that
        # stopped shipping /dev/fuse would quietly reduce the only end-to-end
        # test to a no-op, and CI would stay green.
        run: ONEDRIVE_REQUIRE_FUSE=1 cargo test --workspace

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  overlay-plugin:
    name: Dolphin overlay plugin
    runs-on: ubuntu-latest
    # Ubuntu 24.04 has no KF6 development packages, so the plugin is built in
    # an Arch container instead — which also matches the distribution people
    # actually run Plasma 6 on.
    container: archlinux:latest
    steps:
      # Before checkout: actions/checkout needs git present in the container.
      - name: Install KDE Frameworks 6 build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake extra-cmake-modules kio qt6-base git

      - uses: actions/checkout@v7

      # The plugin is C++ against KDE Frameworks 6 and is built only by
      # install.sh --with-dolphin-overlay, so nothing else in CI touches it.
      # Without this job a configure or compile error surfaces first on a
      # user's machine — which is how kcoreaddons_add_plugin() aborting on an
      # unset CMAKE_LIBRARY_OUTPUT_DIRECTORY took four rounds to find.
      - name: Configure
        run: cmake -S extensions/dolphin -B build-overlay -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-overlay -j"$(nproc)"

      - name: Confirm the plugin was produced
        run: |
          # A green build that emits no shared object would be a silent failure.
          found=$(find build-overlay -name 'onedrive-overlay.so' | head -n 1)
          test -n "$found" || { echo "no onedrive-overlay.so was built"; exit 1; }
          echo "built $found"
