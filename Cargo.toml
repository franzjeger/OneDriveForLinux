[workspace]
members = [
    "crates/graph-client",
    "crates/sync-engine",
    "crates/vfs",
    "crates/daemon",
    "crates/tray",
    "crates/cli",
]
resolver = "2"

# Shared dependencies — crates reference these with `workspace = true` so
# versions and features can never drift between crates.
[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
futures = "0.3"
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
