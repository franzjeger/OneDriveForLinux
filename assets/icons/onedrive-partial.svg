        fill="#E8EDF3" stroke="#12181F" stroke-opacity=".65" stroke-width=".9"/>
  <path d="M4.6 12.4a3.3 3.3 0 0 1-.35-6.58 4.5 4.5 0 0 1 8.46-1.05 3.05 3.05 0 0 1 .32 6.06l-.18.01z"
